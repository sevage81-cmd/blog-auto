<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
{{THEME}}
  * { box-sizing: border-box; }
  body { margin:0; padding:0; }

  #capture-root {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 56px 64px;
  }

  .pitch-lines {
    position: absolute;
    inset: 0;
    opacity: 0.15;
  }
  .pitch-lines .centercircle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 520px;
    height: 520px;
    border: 2px solid #ffffff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }

  .head {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: baseline;
    gap: 18px;
    margin-bottom: 40px;
  }

  .head .name {
    color: #ffffff;
    font-size: 46px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  .head .role {
    color: var(--accent);
    font-size: 22px;
    font-weight: 700;
    border: 1.5px solid var(--accent);
    padding: 6px 16px;
    border-radius: 4px;
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }

  .cards {
    position: relative;
    z-index: 2;
    display: flex;
    gap: 20px;
  }

  .card {
    flex: 1;
    background: rgba(255,255,255,0.04);
    border: 1px solid color-mix(in srgb, var(--accent) 28%, transparent);
    border-top: 3px solid var(--accent);
    border-radius: 6px;
    padding: 26px 22px;
    min-height: 320px;
    display: flex;
    flex-direction: column;
  }

  .card .label {
    color: var(--accent);
    font-size: 18px;
    font-weight: 800;
    letter-spacing: 1px;
    margin-bottom: 18px;
  }

  .card .value {
    color: #ffffff;
    font-size: 24px;
    font-weight: 800;
    line-height: 1.4;
    letter-spacing: -0.3px;
  }

  .card .desc {
    margin-top: 14px;
    color: #e4efeb;
    font-size: 16px;
    font-weight: 600;
    line-height: 1.5;
  }
</style>
</head>
<body>
  <div id="capture-root">
    <div class="pitch-lines">
      <div class="centercircle"></div>
    </div>

    <div class="head">
      <div class="name">{{HEAD_NAME}}</div>
      <div class="role">{{HEAD_ROLE}}</div>
    </div>

    <div class="cards">
{{CARDS}}
    </div>
  </div>
</body>
</html>
