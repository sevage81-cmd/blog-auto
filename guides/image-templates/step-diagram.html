<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<style>
{{THEME}}
  * { box-sizing: border-box; }
  body { margin:0; padding:0; }

  #capture-root {
    width: {{WIDTH}}px;
    height: {{HEIGHT}}px;
    position: relative;
    overflow: hidden;
    background: var(--bg);
    font-family: 'Pretendard', 'Malgun Gothic', 'Apple SD Gothic Neo', sans-serif;
    padding: 56px 70px;
  }

  .pitch-lines {
    position: absolute;
    inset: 0;
    opacity: 0.15;
  }
  .pitch-lines .centercircle {
    position: absolute;
    left: 50%;
    top: 50%;
    width: 520px;
    height: 520px;
    border: 2px solid #ffffff;
    border-radius: 50%;
    transform: translate(-50%, -50%);
  }
  .pitch-lines .halfline {
    position: absolute;
    left: 0; right: 0; top: 50%;
    height: 2px;
    background: #ffffff;
  }

  .header {
    position: relative;
    z-index: 2;
    text-align: center;
    margin-bottom: 34px;
  }
  .eyebrow {
    color: #d7e5e1;
    font-size: 20px;
    font-weight: 700;
    letter-spacing: 2px;
    margin-bottom: 10px;
  }
  .title {
    color: #ffffff;
    font-size: 36px;
    font-weight: 900;
    letter-spacing: -0.5px;
  }

  .scoreboard {
    position: relative;
    z-index: 2;
    display: flex;
    justify-content: center;
    gap: 0;
    margin: 0 auto 48px auto;
    width: fit-content;
    border: 1.5px solid var(--accent);
    border-radius: 6px;
    overflow: hidden;
    background: color-mix(in srgb, var(--accent) 6%, transparent);
  }
  .scoreboard .cell {
    padding: 16px 34px;
    text-align: center;
    border-right: 1px solid color-mix(in srgb, var(--accent) 35%, transparent);
  }
  .scoreboard .cell:last-child { border-right: none; }
  .scoreboard .num {
    color: var(--accent);
    font-size: 30px;
    font-weight: 900;
    line-height: 1.1;
  }
  .scoreboard .label {
    color: #e4efeb;
    font-size: 15px;
    font-weight: 600;
    margin-top: 4px;
  }

  .timeline {
    position: relative;
    z-index: 2;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 0;
  }

  .step {
    width: 260px;
    display: flex;
    flex-direction: column;
    align-items: center;
    text-align: center;
  }

  .step .badge-num {
    width: 34px;
    height: 34px;
    border-radius: 50%;
    background: #1f5a49;
    border: 2px solid var(--accent);
    color: var(--accent);
    font-size: 16px;
    font-weight: 800;
    display: flex;
    align-items: center;
    justify-content: center;
    margin-bottom: 18px;
  }

  .card {
    width: 100%;
    background: rgba(255,255,255,0.05);
    border: 1px solid rgba(255,255,255,0.14);
    border-radius: 10px;
    padding: 26px 18px;
  }
  .card.out {
    border-color: rgba(248, 113, 113, 0.45);
  }
  .card.in {
    border-color: color-mix(in srgb, var(--accent) 60%, transparent);
    background: color-mix(in srgb, var(--accent) 8%, transparent);
  }

  .name {
    color: #ffffff;
    font-size: 25px;
    font-weight: 800;
    margin-bottom: 10px;
  }

  .status {
    display: inline-block;
    font-size: 14px;
    font-weight: 700;
    padding: 5px 14px;
    border-radius: 999px;
    letter-spacing: 0.5px;
  }
  .status.fired {
    color: #fca5a5;
    background: rgba(248, 113, 113, 0.14);
    border: 1px solid rgba(248, 113, 113, 0.4);
  }
  .status.short {
    color: #fcd34d;
    background: rgba(252, 211, 77, 0.14);
    border: 1px solid rgba(252, 211, 77, 0.4);
  }
  .status.appointed {
    color: var(--accent);
    background: color-mix(in srgb, var(--accent) 14%, transparent);
    border: 1px solid color-mix(in srgb, var(--accent) 50%, transparent);
  }

  .connector {
    width: 60px;
    height: 2px;
    background: linear-gradient(90deg, color-mix(in srgb, var(--accent) 15%, transparent), var(--accent));
    position: relative;
    margin: 0 6px;
    align-self: flex-start;
    margin-top: 17px;
  }
  .connector::after {
    content: "";
    position: absolute;
    right: -1px;
    top: 50%;
    width: 0;
    height: 0;
    border-top: 6px solid transparent;
    border-bottom: 6px solid transparent;
    border-left: 8px solid var(--accent);
    transform: translateY(-50%);
  }

  .footer {
    position: relative;
    z-index: 2;
    text-align: center;
    color: #d7e5e1;
    font-size: 16px;
    font-weight: 600;
    margin-top: 44px;
    letter-spacing: 0.5px;
  }
</style>
</head>
<body>
  <div id="capture-root">
    <div class="pitch-lines">
      <div class="halfline"></div>
      <div class="centercircle"></div>
    </div>

    <div class="header">
      <div class="eyebrow">{{EYEBROW}}</div>
      <div class="title">{{TITLE}}</div>
    </div>

    <div class="scoreboard">
{{CELLS}}
    </div>

    <div class="timeline">
{{STEPS}}
    </div>

    <div class="footer">{{FOOTER}}</div>
  </div>
</body>
</html>
